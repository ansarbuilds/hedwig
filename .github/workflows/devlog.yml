# Every push to main: add the pushed commits to logs/DEVLOG.md and commit it back.
name: Update dev log

on:
  push:
    branches: [main]

permissions:
  contents: write   # lets the bot commit the log

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add commits to the log
        env:
          COMMITS: ${{ toJson(github.event.commits) }}
        run: python3 .github/scripts/update_devlog.py

      - name: Commit the log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898183+github-actions[bot]@users.noreply.github.com"
          git add logs/DEVLOG.md
          git diff --cached --quiet && exit 0
          git commit -m "Update dev log"
          git pull --rebase
          git push
